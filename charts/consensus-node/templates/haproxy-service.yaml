{{- $haproxy := .Values.haproxy }}
{{- if .Values.haproxy.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: haproxy-{{ .Values.name }}-svc
  namespace: {{ default .Release.Namespace .Values.global.namespaceOverride }}
  {{- with $haproxy.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  labels:
    solo.hedera.com/type: haproxy-svc
    solo.hedera.com/node-name: {{ .Values.name }}
    solo.hedera.com/node-id: "{{ .Values.nodeId }}"
    solo.hedera.com/account-id: {{ .Values.accountId }}
    solo.hedera.com/prometheus-endpoint: active
    {{- include "solo.testLabels" . | nindent 4 }}
    {{- with $haproxy.service.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  type: {{ default "ClusterIP" $haproxy.service.type }}
  {{- if or (eq $haproxy.service.type "LoadBalancer") (eq $haproxy.service.type "NodePort") }}
  externalTrafficPolicy: {{ default "Local" $haproxy.service.externalTrafficPolicy }}
  {{- end }}
  {{- if .Values.haproxyStaticIP }}
  loadBalancerIP: {{ .Values.haproxyStaticIP }}
  {{- end }}
  selector:
    app: haproxy-{{ .Values.name }}
  ports:
    - name: non-tls-grpc-client-port
      port: 50211
      targetPort: 50211
    - name: tls-grpc-client-port
      port: 50212
      targetPort: 50212
    - name: prometheus # port name must be prometheus for prometheus-svc-monitor
      port: 9090
      targetPort: 9090 # stats port
{{- end }}
