{{- if .Values.sidecars.grafanaAlloy.enabled }}
{{- $_ := required "sidecars.grafanaAlloy.remoteWrite.endpoint is required when the Grafana Alloy sidecar is enabled" .Values.sidecars.grafanaAlloy.remoteWrite.endpoint }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: alloy-cm-{{ .Values.name }}
  namespace: {{ default .Release.Namespace .Values.global.namespaceOverride }}
  labels:
    {{- include "solo.testLabels" . | nindent 4 }}
data:
  config.alloy: |
  {{- $params := dict "" "" -}}
  {{- $_ignore := set $params "alloyDefaults" .Values.sidecars.grafanaAlloy -}}
  {{- $_ignore = set $params "Template" .Template -}}
  {{- $_ignore = set $params "environment_name" .Release.Namespace -}}
  {{/* the umbrella chart passed the node's index within its cluster; a per-node release uses the
       node id, which is stable across clusters and equal to the index for a single-cluster roster */}}
  {{- $_ignore = set $params "alloy_node_id" .Values.nodeId -}}
  {{- tpl ( .Files.Get "config-files/alloy-config.alloy" ) $params | nindent 4 }}
{{- end }}
